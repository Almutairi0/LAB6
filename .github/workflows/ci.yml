# CHANGE 20XXXXXXX to your real university ID
name: CI-Pipeline-20XXXXXXX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build -v ./...

  test:
    name: Test
    needs: build          # runs only if Build succeeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test -v ./...

  deploy:
    name: Deploy
    needs: test           # runs only if Test succeeds
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying application... done"
